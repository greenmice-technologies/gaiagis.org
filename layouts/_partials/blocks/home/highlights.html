<section id="highlights" class="highlights relative py-8 xl:py-12">
  <div class="container mx-auto grid gap-4 px-4 xl:grid-cols-2">
    {{ range .items }}
      <div class="flex flex-col gap-3 rounded-xl border border-[#e5e5e5] bg-white p-6 text-left shadow-sm">
        <h2 class="text-base font-semibold tracking-tight text-[#0a0a0a]">{{ .title }}</h2>
        <p class="text-sm leading-normal text-[#737373]">{{ .text }}</p>
        {{ with .button }}
          <div class="mt-2">
            {{ partial "components/button/primary" (dict "label" .label "href" .link) }}
          </div>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
