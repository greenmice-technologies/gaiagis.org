baseURL: "https://gaiagis.org/"
title: "Gaia"
summaryLength: 35

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: always
      image:
        useEmbedded: always

defaultContentLanguage: en
defaultContentLanguageInSubdir: true
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageName: English
    languageCode: en
    weight: 1
    contentDir: content/en
    params:
      description: "Gaia Community is a self-hosted web GIS for data analysts. Notebooks, layers, and print layouts run on your own machines."
  it:
    languageName: Italiano
    languageCode: it
    weight: 2
    contentDir: content/it
    params:
      description: "Gaia Community è un web GIS self-hosted per analisti di dati. Notebook, layer e stampe girano sui propri sistemi."
  pt:
    languageName: Português
    languageCode: pt
    weight: 3
    contentDir: content/pt
    params:
      description: "Gaia Community é um web GIS self-hosted para analistas de dados. Notebooks, camadas e impressão correm nos seus próprios sistemas."
