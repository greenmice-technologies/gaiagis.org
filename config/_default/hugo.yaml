baseURL: "https://gaiagis.org/"
title: "Gaia"
summaryLength: 35

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: always
      image:
        useEmbedded: always

defaultContentLanguage: en
defaultContentLanguageInSubdir: true
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageName: English
    languageCode: en
    weight: 1
    contentDir: content/en
    params:
      description: "Create maps, explore data, and share your work from your browser with Gaia."
  it:
    languageName: Italiano
    languageCode: it
    weight: 2
    contentDir: content/it
    params:
      description: "Crea mappe, esplora i dati e condividi il tuo lavoro dal browser con Gaia."
  pt:
    languageName: Português
    languageCode: pt
    weight: 3
    contentDir: content/pt
    params:
      description: "Crie mapas, explore dados e compartilhe seu trabalho pelo navegador com Gaia."
