baseURL: "https://gaiagis.org/"
title: "Gaia GIS"
summaryLength: 35

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: always
      image:
        useEmbedded: always

defaultContentLanguage: en
defaultContentLanguageInSubdir: true
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageName: English
    languageCode: en
    weight: 1
    contentDir: content/en
    params:
      description: "Turn geographic data into maps, analytical notebooks, and print-ready deliverables with Gaia GIS, the self-hosted web GIS."
