baseURL: "https://gaiagis.org/"
title: "Gaia"
summaryLength: 35

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      link:
        useEmbedded: always
      image:
        useEmbedded: always

defaultContentLanguage: en
defaultContentLanguageInSubdir: true
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageName: English
    languageCode: en
    weight: 1
    contentDir: content/en
    params:
      description: "Create maps, explore data, and share your work from your browser with Gaia."
