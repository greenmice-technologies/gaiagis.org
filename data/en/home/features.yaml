enable: true
title: 'From the first file to the finished map'
text: 'Work with your data, refine the details, and give others a clear view of what you have found.'
items:
  - icon: 'fas fa-database'
    color: '#10b981'
    pretitle: 'Data'
    pretext: 'Import and explore'
    title: '**Bring your geographic data** together'
    text: 'Import files such as Shapefile, GeoJSON, GeoTIFF, and KML. Explore their contents on the map and in the table, or add layers from external map services.'
    image: 'images/gaia-gis.png'
  - icon: 'fas fa-pen'
    color: '#10b981'
    pretitle: 'Editing'
    pretext: 'Shapes, attributes, and styles'
    title: '**Get the details** right'
    text: 'Draw and edit features, update their attributes, and adjust the way they appear. See your changes on the map as you work.'
    image: 'images/gaia-gis.png'
  - icon: 'fas fa-share-nodes'
    color: '#10b981'
    pretitle: 'Projects'
    pretext: 'Organize and share'
    title: '**Keep your work** together'
    text: 'Organize maps, layers, and supporting files in a workspace. Keep a project private or publish it for others to view.'
    image: 'images/gaia-gis.png'
