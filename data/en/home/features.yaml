enable: true

title: "Notebook, layers, and print"

text: "Gaia Community is the base product: a browser workspace for analysis, cartography, and a page you can publish from the same install."

items:
  - pretitle: "Notebook"
    pretext: "Document, query, publish"
    color: "#4264FB"
    icon: "book-open"
    title: "Write the analysis next to the map"
    text: "A notebook holds SQL cells that render as a table, a map, or a chart, plus layer and snapshot blocks. Publish it at a public address, or export HTML and PDF."

  - pretitle: "Layers"
    pretext: "Import, edit, style"
    color: "#4264FB"
    icon: "layers-3"
    title: "Bring your data into the workspace"
    text: "Import common vector and raster formats, draw and edit geometries and attributes, and style layers in the browser. External WMS and WFS services can be added as sources."

  - pretitle: "Print"
    pretext: "Layout and GeoPDF"
    color: "#4264FB"
    icon: "printer"
    title: "Compose the sheet and export it"
    text: "The layout editor lives in the app. GeoPDF export runs through the QGIS print service on the same stack, and that service stays off the public network."
