enable: true

title: 'Maps and charts<br/>on your own machines'

text: 'Gaia Community is a self-hosted web GIS for data analysts. Notebooks, layers, and print layouts run where you install them.'

buttons:
  - label: 'Install'
    link: 'install/'
  - label: 'Product'
    link: 'product/'

image: 'images/home/hero/hero.svg'

items:
  - icon: 'book-open'
    color: '#4264FB'
    title: 'Notebook'
    text: 'SQL, map, and chart in one document. Publish a page or export HTML and PDF.'

  - icon: 'layers-3'
    color: '#4264FB'
    title: 'Layers'
    text: 'Import common formats, draw and edit features, and style them in the browser.'

  - icon: 'printer'
    color: '#4264FB'
    title: 'Print'
    text: 'Compose a layout in the app and export a GeoPDF.'

  - icon: 'server'
    color: '#4264FB'
    title: 'One stack'
    text: 'App, print, PostgreSQL, and storage start from a single Compose file.'
